name: Compilar 3DS (.3dsx y .cia)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas para el CIA (makerom, bannertool)
        continue-on-error: true
        run: |
          apt-get update && apt-get install -y wget unzip
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          unzip -o makerom-*.zip -d /usr/local/bin && chmod +x /usr/local/bin/makerom
          wget -q https://github.com/carstene1ns/3ds-bannertool/releases/download/v1.2.0/bannertool.zip
          unzip -o bannertool.zip -d bt && cp bt/linux-x86_64/bannertool /usr/local/bin/ && chmod +x /usr/local/bin/bannertool
      - name: Compilar .3dsx
        run: make 3dsx
      - name: Generar .cia
        continue-on-error: true
        run: make cia
      - uses: actions/upload-artifact@v4
        with:
          name: moncloas-fighter-3ds
          path: |
            *.3dsx
            *.cia
